<!doctype html>
<html data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register | VendorBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo">VB</div>
    <h4 class="text-center mb-3">Create account</h4>
    <div id="msg"></div>
    <div class="row g-2">
      <div class="col-md-6"><input id="first_name" class="form-control" placeholder="First Name"></div>
      <div class="col-md-6"><input id="last_name" class="form-control" placeholder="Last Name"></div>
      <div class="col-md-6"><input id="email" class="form-control" placeholder="Email Address" type="email"></div>
      <div class="col-md-6"><input id="phone" class="form-control" placeholder="Phone Number (10 digits)"></div>
      <div class="col-md-6">
        <select id="role" class="form-select">
          <option>Procurement Officer</option>
          <option>Vendor</option>
          <option>Manager/Approver</option>
        </select>
      </div>
      <div class="col-md-6"><input id="country" class="form-control" placeholder="Country"></div>
      <div class="col-12"><input id="pw" class="form-control" placeholder="Password (8+, letters & numbers)" type="password"></div>
      <div class="col-12"><textarea id="additional_info" class="form-control" rows="3" placeholder="Additional Information ...."></textarea></div>
    </div>
    <button class="btn btn-green w-100 mt-3" onclick="reg()">Register</button>
    <p class="mt-3 mb-0 text-center small"><a href="/login.html">Back to login</a></p>
  </div>
</div>
<script src="app.js"></script>
<script>
const v = id => document.getElementById(id).value;
async function reg() {
  try {
    const d = await api('/api/auth/register', 'POST', {
      first_name: v('first_name'), last_name: v('last_name'), email: v('email'),
      phone: v('phone'), role: v('role'), country: v('country'),
      password: v('pw'), additional_info: v('additional_info')
    });
    showErr('msg', d.message, true);
    setTimeout(() => location.href = '/login.html', 1200);
  } catch (e) { showErr('msg', e.message); }
}
</script>
</body>
</html>
