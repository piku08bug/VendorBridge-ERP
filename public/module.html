<!doctype html>
<html data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VendorBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<main class="main">
  <h4 id="title"></h4>
  <div class="empty mt-3">
    <p class="mb-1 fs-5">Nothing here yet</p>
    <p class="mb-0" id="note"></p>
  </div>
</main>
<script src="app.js"></script>
<script>
(async () => {
  const m = new URLSearchParams(location.search).get('m') || 'Module';
  await initPage(m);
  document.getElementById('title').textContent = m;
  document.getElementById('note').textContent = m + ' is scheduled for a later week and has no data yet.';
})();
</script>
</body>
</html>
