<!doctype html>
<html data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | VendorBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap" style="max-width:400px">
  <div class="auth-card">
    <div class="logo">VB</div>
    <h4 class="text-center mb-3">VendorBridge</h4>
    <div id="msg"></div>
    <input id="email" class="form-control mb-2" placeholder="Username (email)" type="email">
    <input id="pw" class="form-control mb-3" placeholder="Password" type="password">
    <button class="btn btn-green w-100" onclick="login()">Login</button>
    <p class="mt-3 mb-0 text-center small">
      <a href="/register.html">Register</a> | <a href="/forgot.html">Forgot password?</a>
    </p>
  </div>
</div>
<script src="app.js"></script>
<script>
async function login() {
  try {
    await api('/api/auth/login', 'POST', {
      email: document.getElementById('email').value,
      password: document.getElementById('pw').value
    });
    location.href = '/dashboard.html';
  } catch (e) { showErr('msg', e.message); }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
