<!doctype html>
<html data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap" style="max-width:400px">
  <div class="auth-card">
    <div class="logo">VB</div>
    <h4 class="text-center mb-3">Forgot password</h4>
    <div id="msg"></div>
    <input id="email" class="form-control mb-2" placeholder="Email" type="email">
    <button class="btn btn-green w-100" onclick="go()">Send reset link</button>
    <p id="link" class="mt-3 small"></p>
    <a href="/login.html">Back to login</a>
  </div>
</div>
<script src="app.js"></script>
<script>
async function go() {
  try {
    const d = await api('/api/auth/forgot', 'POST', { email: document.getElementById('email').value });
    showErr('msg', d.message, true);
    if (d.devResetLink)
      document.getElementById('link').innerHTML = 'Dev link: <a href="' + esc(d.devResetLink) + '">Reset now</a>';
  } catch (e) { showErr('msg', e.message); }
}
</script>
</body>
</html>
