<!doctype html>
<html data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard | VendorBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<main class="main">
  <h4 class="mb-0">Dashboard</h4>
  <p class="text-secondary" id="welcome"></p>

  <div class="row g-3 mb-4" id="cards"></div>

  <div class="row g-3 mb-4">
    <div class="col-lg-7">
      <div class="panel">
        <h6>Recent Purchase Orders</h6>
        <table class="table table-sm align-middle mb-2">
          <thead><tr><th>PO#</th><th>Vendor</th><th>Amount</th><th>Status</th></tr></thead>
        </table>
        <div class="empty">No purchase orders yet. This module arrives in a later week.</div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="panel">
        <h6>Spending Trends (last 6 months)</h6>
        <div class="empty">No spending data yet. Charts appear once purchase orders exist.</div>
      </div>
    </div>
  </div>

  <h6>Quick actions</h6>
  <div class="d-flex gap-2 flex-wrap" id="actions"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const u = await initPage('Dashboard');
  const d = await api('/api/dashboard');
  document.getElementById('welcome').textContent = `Welcome back, ${u.name} (${u.role}) - Today's Overview`;
  const items = [
    ["Active RFQ's", 0], ['Pending Approvals', d.pendingApprovals],
    ["PO's this month", d.purchaseOrders], ['Overdue invoices', d.invoices],
    ['Total vendors', d.totalVendors]
  ];
  document.getElementById('cards').innerHTML = items.map(([t, n]) => `
    <div class="col-6 col-md-4 col-xl"><div class="stat">
      <div class="n">${n}</div><div class="l">${esc(t)}</div></div></div>`).join('');

  const canWrite = ['Procurement Officer', 'Admin'].includes(u.role);
  document.getElementById('actions').innerHTML =
    '<a class="btn btn-outline-light btn-sm" href="/module.html?m=' + encodeURIComponent("RFQ's") + '">+ new RFQ</a>' +
    (canWrite ? '<a class="btn btn-green btn-sm" href="/vendors.html?new=1">Add Vendor</a>' : '') +
    '<a class="btn btn-outline-light btn-sm" href="/module.html?m=Invoices">View Invoices</a>';
})();
</script>
</body>
</html>
