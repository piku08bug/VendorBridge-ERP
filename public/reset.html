<!doctype html>
<html data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap" style="max-width:400px">
  <div class="auth-card">
    <div class="logo">VB</div>
    <h4 class="text-center mb-3">Set new password</h4>
    <div id="msg"></div>
    <input id="pw" class="form-control mb-2" placeholder="New password" type="password">
    <button class="btn btn-green w-100" onclick="go()">Update password</button>
  </div>
</div>
<script src="app.js"></script>
<script>
async function go() {
  try {
    const token = new URLSearchParams(location.search).get('token');
    const d = await api('/api/auth/reset', 'POST', { token, password: document.getElementById('pw').value });
    showErr('msg', d.message, true);
    setTimeout(() => location.href = '/login.html', 1200);
  } catch (e) { showErr('msg', e.message); }
}
</script>
</body>
</html>
